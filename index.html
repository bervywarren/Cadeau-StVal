<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mots de cœur</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" />
    <meta name="theme-color" content="#5a1236" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Fredoka:wght@400;500&family=Jost:wght@300;400;500&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Variables de thème : elles sont remplacées par le script selon l'occasion */
      :root {
        --b1: #1d0715;
        --b2: #5a1236;
        --ink: #ffe9ef;
        --ac: #ff6b9a;
        --ac2: #f1cf9a;
        --on: #fff;
        --fd: "Pinyon Script", cursive;
        --fm: "Cormorant Garamond", Georgia, serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Jost", system-ui, sans-serif;
        font-weight: 300;
        background: radial-gradient(
            1000px circle at 20% 0%,
            var(--b2),
            var(--b1) 75%
          )
          fixed var(--b1);
        overflow-x: hidden;
        transition: color 0.5s;
      }
      #particules {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .p {
        position: absolute;
        opacity: 0;
      }
      .p.fall {
        top: -40px;
        animation: tombe linear forwards;
      }
      .p.rise {
        bottom: -40px;
        animation: monte linear forwards;
      }
      @keyframes tombe {
        0% {
          transform: translate(0, 0) rotate(0);
          opacity: 0;
        }
        10% {
          opacity: 0.75;
        }
        100% {
          transform: translate(var(--dx), 112vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      @keyframes monte {
        0% {
          transform: translate(0, 0) rotate(0);
          opacity: 0;
        }
        10% {
          opacity: 0.75;
        }
        100% {
          transform: translate(var(--dx), -112vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .page {
        position: relative;
        max-width: 1100px;
        margin: 0 auto;
        padding: 22px 16px 48px;
      }
      .entete {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .marque {
        font-family: var(--fd);
        font-size: 2.2rem;
        color: var(--ac);
      }
      .sous {
        font-size: 0.95rem;
        opacity: 0.75;
      }
      .grille {
        display: grid;
        gap: 18px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 900px) {
        .grille {
          grid-template-columns: 1.1fr 0.9fr;
          align-items: start;
        }
        .collant {
          position: sticky;
          top: 16px;
        }
      }
      .bloc {
        background: color-mix(in srgb, var(--ink) 7%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
        border-radius: 24px;
        padding: 20px;
        margin-bottom: 16px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      h2 {
        margin: 0 0 14px;
        font-size: 1rem;
        font-weight: 500;
      }
      .cartes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 10px;
      }
      .occ {
        font: inherit;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 18px;
        padding: 20px 8px;
        font-size: 1.05rem;
        transition:
          transform 0.25s,
          border-color 0.25s;
        text-align: center;
      }
      .occ:hover {
        transform: translateY(-3px);
      }
      .occ[aria-pressed="true"] {
        border-color: var(--ac);
        transform: scale(1.04);
        box-shadow: 0 10px 26px -10px var(--ac);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
        color: var(--ink);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--ink) 28%, transparent);
        border-radius: 999px;
        padding: 8px 15px;
        transition: all 0.25s;
      }
      .chip:hover {
        border-color: var(--ac);
      }
      .chip[aria-pressed="true"] {
        background: var(--ac);
        color: var(--on);
        border-color: transparent;
      }
      .champs {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      @media (min-width: 560px) {
        .champs {
          grid-template-columns: 1fr 1fr;
        }
      }
      label {
        font-size: 0.88rem;
        display: block;
      }
      input,
      textarea {
        width: 100%;
        font: inherit;
        font-size: 1.02rem;
        color: var(--ink);
        margin-top: 6px;
        padding: 12px 14px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      }
      textarea {
        min-height: 140px;
        resize: vertical;
        line-height: 1.5;
        margin-top: 0;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--ac);
      }
      button:focus-visible {
        outline: 3px solid var(--ac2);
        outline-offset: 2px;
      }
      #erreur {
        color: var(--ac2);
        font-size: 0.9rem;
        min-height: 1.2em;
        margin: 10px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      .principal {
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        color: var(--on);
        border: 0;
        border-radius: 999px;
        padding: 13px 26px;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        box-shadow: 0 12px 28px -12px var(--ac);
        transition: transform 0.25s;
      }
      .principal:hover {
        transform: translateY(-2px);
      }
      .discret {
        font: inherit;
        cursor: pointer;
        color: var(--ink);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
        border-radius: 999px;
        padding: 12px 22px;
      }
      .discret:hover {
        border-color: var(--ac);
      }
      .carte {
        text-align: center;
        padding: 34px 20px 30px;
        border-radius: 26px;
        border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
        background: color-mix(in srgb, var(--ink) 5%, transparent);
        box-shadow: 0 24px 60px -30px var(--ac);
      }
      .titre {
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ac2);
        margin-bottom: 6px;
      }
      .nom {
        font-family: var(--fd);
        font-size: clamp(2.8rem, 10vw, 4.4rem);
        line-height: 1.1;
        color: var(--ac);
        overflow-wrap: anywhere;
      }
      .orne {
        width: 140px;
        height: 20px;
        margin: 6px auto 14px;
        display: block;
        stroke: var(--ac2);
        fill: var(--ac2);
      }
      .msg {
        font-family: var(--fm);
        font-style: italic;
        font-weight: 500;
        font-size: clamp(1.2rem, 3.8vw, 1.5rem);
        line-height: 1.6;
        margin: 0 0 16px;
        white-space: pre-line;
      }
      .sign {
        font-family: var(--fd);
        font-size: 1.8rem;
        color: var(--ac2);
      }
      .anime .nom {
        animation: revele 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .anime .mot {
        display: inline-block;
        margin-right: 0.26em;
        opacity: 0;
        animation: apparait 0.8s ease forwards;
      }
      .anime .sign,
      .anime .orne {
        opacity: 0;
        animation: apparait 1.2s ease forwards;
      }
      @keyframes revele {
        from {
          opacity: 0;
          letter-spacing: 0.3em;
          filter: blur(12px);
        }
        to {
          opacity: 1;
          letter-spacing: 0;
          filter: blur(0);
        }
      }
      @keyframes apparait {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      #lienZone {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      #lienZone input {
        margin: 0;
      }
      #cadeau {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px 16px;
        position: relative;
      }
      #cadeau[hidden],
      #tableau[hidden] {
        display: none;
      }
      #cadeau .carte {
        width: 100%;
        max-width: 620px;
        padding: 46px 24px 40px;
      }
      #cadeau .nom {
        font-size: clamp(3.6rem, 16vw, 6.4rem);
      }
      #cadeau .msg {
        font-size: clamp(1.35rem, 4.6vw, 1.75rem);
      }
      @media (prefers-reduced-motion: reduce) {
        .p {
          display: none;
        }
        .anime .nom,
        .anime .mot,
        .anime .sign,
        .anime .orne {
          animation: none;
          opacity: 1;
          filter: none;
        }
      }

      /* Halo qui suit le pointeur */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          520px circle at var(--x, 50%) var(--y, 20%),
          color-mix(in srgb, var(--ac) 22%, transparent),
          transparent 70%
        );
      }
      .page {
        z-index: 1;
      }
      #decor {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #decor svg {
        position: absolute;
        animation: fondu 1.6s ease both;
      }
      @keyframes fondu {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .logo {
        width: 34px;
        height: 34px;
        vertical-align: -8px;
        margin-right: 8px;
        filter: drop-shadow(
          0 4px 10px color-mix(in srgb, var(--ac) 50%, transparent)
        );
      }
      .emb {
        width: 88px;
        height: 88px;
        margin: 0 auto 6px;
        display: block;
        fill: none;
        stroke: var(--ac);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: flotte 5s ease-in-out infinite;
      }
      .emb .f {
        fill: var(--ac2);
        stroke: none;
      }
      .emb .fa {
        fill: var(--ac);
        fill-opacity: 0.2;
      }
      @keyframes flotte {
        50% {
          transform: translateY(-5px);
        }
      }
      .anime .emb .tr {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: trace 2.4s 0.2s ease forwards;
      }
      .anime .emb .f,
      .anime .emb .fa {
        opacity: 0;
        animation: apparait 1s 1.6s ease forwards;
      }
      @keyframes trace {
        to {
          stroke-dashoffset: 0;
        }
      }
      .occ {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 8px;
      }
      .occ .emb {
        width: 46px;
        height: 46px;
        margin: 0;
        animation: none;
      }
      .carte {
        transition: transform 0.2s ease-out;
        will-change: transform;
      }
      @media (prefers-reduced-motion: reduce) {
        .emb,
        #decor svg {
          animation: none;
        }
        .anime .emb .tr {
          animation: none;
          stroke-dasharray: none;
          stroke-dashoffset: 0;
        }
        .anime .emb .f,
        .anime .emb .fa {
          animation: none;
          opacity: 1;
        }
      }

      [hidden] {
        display: none !important;
      }
      #aa {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: 12px;
        z-index: 30;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: color-mix(in srgb, var(--ink) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      .progres {
        display: flex;
        gap: 6px;
        margin: 0 0 18px;
      }
      .progres i {
        flex: 1;
        height: 5px;
        border-radius: 5px;
        background: color-mix(in srgb, var(--ink) 18%, transparent);
        transition: background 0.5s;
      }
      .progres i.ok {
        background: var(--ac);
      }
      .etape {
        min-height: 320px;
        animation: entree2 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes entree2 {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .q {
        font-family: var(--fd);
        font-weight: 400;
        font-size: clamp(2rem, 7vw, 2.8rem);
        line-height: 1.1;
        color: var(--ac);
        margin: 0 0 6px;
      }
      .aide {
        opacity: 0.8;
        margin: 0 0 18px;
        font-size: 0.98rem;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .cc {
        display: grid;
        gap: 10px;
      }
      .carteChoix {
        font: inherit;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
        background: color-mix(in srgb, var(--ink) 6%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
        border-radius: 18px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: all 0.25s;
      }
      .carteChoix:hover {
        border-color: var(--ac);
        transform: translateY(-2px);
      }
      .carteChoix[aria-pressed="true"] {
        border-color: var(--ac);
        background: color-mix(in srgb, var(--ac) 18%, transparent);
      }
      .carteChoix strong {
        font-weight: 500;
        font-size: 1.05rem;
      }
      .carteChoix span {
        opacity: 0.75;
        font-size: 0.92rem;
      }
      .rev {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .rev .carteChoix {
        align-items: center;
        text-align: center;
      }
      .rev svg {
        width: 48px;
        height: 48px;
        fill: none;
        stroke: var(--ac);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h3 {
        font-size: 0.95rem;
        font-weight: 500;
        margin: 22px 0 10px;
      }
      .teintes {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .teinte {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .teinte[aria-pressed="true"] {
        border-color: var(--ink);
      }
      .accueil {
        text-align: center;
        max-width: 520px;
        animation: entree2 0.9s both;
      }
      .accueil .nom {
        font-size: clamp(3rem, 13vw, 5rem);
      }
      .compte {
        font-size: 1.2rem;
        font-variant-numeric: tabular-nums;
        margin: 14px 0;
      }
      #feux {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }
      #ouverture {
        position: fixed;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .rid {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.2) 0 16px,
            rgba(255, 255, 255, 0.07) 16px 32px
          ),
          linear-gradient(var(--ac), color-mix(in srgb, var(--ac) 55%, #000));
        transition: transform 1.5s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .rid.g {
        left: 0;
      }
      .rid.d {
        right: 0;
      }
      #ouverture.go .rid.g {
        transform: translateX(-102%);
      }
      #ouverture.go .rid.d {
        transform: translateX(102%);
      }
      .obj {
        width: min(260px, 70vw);
        overflow: visible;
      }
      .obj * {
        transform-box: fill-box;
      }
      .couv {
        transition:
          transform 1s ease,
          opacity 0.8s ease 0.2s;
        transform-origin: 50% 100%;
      }
      .go .couv {
        transform: translateY(-80px) rotate(-14deg);
        opacity: 0;
      }
      .corps {
        transition: opacity 0.5s ease 0.9s;
      }
      .go .corps {
        opacity: 0;
      }
      .rabat {
        transform-origin: 50% 0;
        transition:
          transform 0.8s ease,
          opacity 0.4s ease 1s;
      }
      .go .rabat {
        transform: scaleY(-1);
        opacity: 0;
      }
      .lettre {
        transition:
          transform 0.9s ease 0.6s,
          opacity 0.5s ease 1.3s;
      }
      .go .lettre {
        transform: translateY(-70px);
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .rid,
        .couv,
        .corps,
        .rabat,
        .lettre {
          transition: none;
        }
      }
      @media (max-width: 899px) {
        #apercuCol {
          display: none;
        }
        body.final #apercuCol {
          display: block;
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="particules" aria-hidden="true"></div>
    <div id="decor" aria-hidden="true"></div>
    <canvas id="feux" aria-hidden="true"></canvas>
    <button id="aa" type="button" aria-label="Taille du texte">Aa</button>
    <div class="page">
      <div id="createur">
        <div class="entete">
          <span class="marque"
            ><svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" style="stop-color: var(--ac)" />
                  <stop offset="1" style="stop-color: var(--ac2)" />
                </linearGradient>
              </defs>
              <path
                fill="url(#lg)"
                d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 2.8 4.5 6.4 4.5c2 0 3.7 1.1 4.6 2.8h2c.9-1.7 2.6-2.8 4.6-2.8 3.6 0 5.5 3.7 4 7.2C19.5 16.4 12 21 12 21z"
              />
              <path
                d="M18.5 2l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"
                fill="var(--ac2)"
              /></svg
            >Mots de cœur</span
          >
          <span class="sous" id="compteur"></span>
        </div>
        <div class="progres" id="progres" aria-hidden="true"></div>
        <div class="grille">
          <section>
            <div class="bloc etape" id="etape" aria-live="polite"></div>
            <div class="nav">
              <button class="discret" id="retour" type="button">Retour</button
              ><button class="principal" id="suivant" type="button">
                Continuer
              </button>
            </div>
          </section>
          <aside id="apercuCol">
            <div class="bloc collant">
              <h2>Aperçu</h2>
              <article class="carte" id="apercu"></article>
            </div>
          </aside>
        </div>
      </div>
      <section id="cadeau" hidden>
        <div class="accueil" id="accueil"></div>
        <div id="ouverture" hidden aria-hidden="true"></div>
        <div id="scene" hidden>
          <article class="carte" id="carteCadeau"></article>
          <div
            class="actions"
            id="actionsCadeau"
            style="justify-content: center"
          ></div>
        </div>
      </section>
    </div>
    <template id="modele">
      <svg class="emb" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <div class="titre"></div>
      <div class="nom"></div>
      <svg class="orne" viewBox="0 0 150 22" aria-hidden="true">
        <path d="M2 11h58M90 11h58" fill="none" stroke-width="1" />
        <path
          d="M75 19s-9-5.5-11.500-11C62 4.500 64.500 2 67.500 2c2.700 0 5 1.500 7.500 4 2.500-2.500 4.800-4 7.500-4 3 0 5.500 2.500 4 6-2.500 5.500-11.500 11-11.500 11z"
          stroke="none"
        />
      </svg>
      <p class="msg"></p>
      <div class="sign"></div>
    </template>
    <script>
      var $ = function (i) {
        return document.getElementById(i);
      };
      var REDUIT = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      // Identité visuelle de chaque occasion (couleurs, polices, particules)
      var T = {
        anniversaire: {
          nom: "Anniversaire",
          titre: "Joyeux anniversaire",

          (j ? j + " j " : "") +
          ("0" + h).slice(-2) +

          ("0" + m).slice(-2) +

          ("0" + x).slice(-2) +

      function lireAdresse() {

        try {
          var d = deHex(h);
          if (!T[themeId(d.o, d.t)]) {

          d.r = REL[d.r] ? d.r : "ami";
          d.n = String(d.n).slice(0, 30);

          d.f = String(d.f || "").slice(0, 30);
          d.l = [0, 1, 2].indexOf(d.l) > -1 ? d.l : 0;
          d.s = d.s ? 1 : 0;
          d.d = +d.d > 0 ? +d.d : 0;

      window.addEventListener("pointermove", function (e) {
        document.body.style.setProperty("--x", e.clientX + "px");
        document.body.style.setProperty("--y", e.clientY + "px");
        if (REDUIT) return;
        ["carteCadeau", "apercu"].forEach(function (id) {
          var c = $(id);
          if (c.offsetParent === null) return;
          var r = c.getBoundingClientRect(),
            dx = (e.clientX - (r.left + r.width / 2)) / window.innerWidth,
            dy = (e.clientY - (r.top + r.height / 2)) / window.innerHeight;
          c.style.transform =
            "perspective(900px) rotateY(" +
            (dx * 10).toFixed(2) +
            "deg) rotateX(" +
            (-dy * 10).toFixed(2) +
            "deg)";
        });
      });
      // Mode hors connexion (nécessite sw.js à côté de la page, sur un hébergement web)
      if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
        try {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        } catch (e) {}
      }
      if (!lireAdresse()) {
        appliquerTheme();
        render();
      }
    </script>
  </body>
</html>
